# 0919 batteries: RIGHT arm active, LEFT arm/gripper masked; two task prompts.
# The supplied dataset already has action shifted by one frame: do not shift again.
# Raw layout: left joints [0:7], left gripper [14], right joints [15:22],
# right gripper [29]. Cartesian pose fields are deliberately not model targets.
_target_: g05.data.mixture_lerobot_dataset.MixtureLerobotDataset
use_weight_normalization: true
use_weight_for_sampling: false
action_size: 32
past_action_size: 0
obs_size: 1
obs_stride_second: 0.0
val_set_proportion: 0.0
is_training_set: true

# Applied after the r1pro task-level processor defaults. This placement is
# intentional: model.processor.action_filter otherwise overrides the per-embodiment
# action_filter below with DummyActionFilter during config composition.
processor_overrides:
  action_filter:
    _target_: g05.data_processor.transforms.action_filter.FixedInactivePartsActionFilter
    inactive_keys: [left_arm, left_gripper]
    hold_inactive_parts: true

processors:
  galaxea_r1pro:
    shape_meta: &shape_meta
      action:
      - key: left_arm
        lerobot_key: action
        start_index: 0
        raw_shape: 7
        shape: 7
        time_offset: 0
      - key: left_gripper
        lerobot_key: action
        start_index: 14
        raw_shape: 1
        shape: 1
        time_offset: 0
      - key: right_arm
        lerobot_key: action
        start_index: 15
        raw_shape: 7
        shape: 7
        time_offset: 0
      - key: right_gripper
        lerobot_key: action
        start_index: 29
        raw_shape: 1
        shape: 1
        time_offset: 0
      state:
      - key: left_arm
        lerobot_key: observation.state
        start_index: 0
        raw_shape: 7
        shape: 7
        time_offset: 0
      - key: left_gripper
        lerobot_key: observation.state
        start_index: 14
        raw_shape: 1
        shape: 1
        time_offset: 0
      - key: right_arm
        lerobot_key: observation.state
        start_index: 15
        raw_shape: 7
        shape: 7
        time_offset: 0
      - key: right_gripper
        lerobot_key: observation.state
        start_index: 29
        raw_shape: 1
        shape: 1
        time_offset: 0
      images:
      - key: head_rgb
        camera_type: exterior
        lerobot_key: observation.images.headDepthCamera
        start_index: 0
        raw_shape: [3, 480, 848]
        shape: [3, 256, 256]
        time_offset: 0
      - key: left_wrist_rgb
        camera_type: wrist_left
        lerobot_key: observation.images.leftCamera
        start_index: 0
        raw_shape: [3, 480, 848]
        shape: [3, 256, 256]
        time_offset: 0
      - key: right_wrist_rgb
        camera_type: wrist_right
        lerobot_key: observation.images.rightCamera
        start_index: 0
        raw_shape: [3, 480, 848]
        shape: [3, 256, 256]
        time_offset: 0

    # Joint targets are deltas from the current observation. With action_shift1,
    # horizon step 0 is the next-frame command rather than a duplicated current pose.
    action_state_transforms:
    - _target_: g05.data_processor.transforms.relative_action.RelativeJointTransform
      keys: [left_arm, right_arm]

    train_transforms:
      head_rgb: ${oc.load:configs/data/_transforms.yaml,train_head}
      left_wrist_rgb: ${oc.load:configs/data/_transforms.yaml,train_wrist}
      right_wrist_rgb: ${oc.load:configs/data/_transforms.yaml,train_wrist}
    val_transforms:
      head_rgb: ${oc.load:configs/data/_transforms.yaml,val}
      left_wrist_rgb: ${oc.load:configs/data/_transforms.yaml,val}
      right_wrist_rgb: ${oc.load:configs/data/_transforms.yaml,val}

    norm_default_mode: z-score-tail
    norm_exception_mode:
      action:
        # These targets are masked below; dummy stats avoid normalizing stationary noise.
        left_arm: dummy
        left_gripper: dummy
        right_gripper: q01/q99
      state:
        left_gripper: q01/q99
        right_gripper: q01/q99
    # False mask entries are removed from the FM-loss numerator and denominator,
    # so the stationary left arm and gripper produce no loss gradient.
    action_filter:
      _target_: g05.data_processor.transforms.action_filter.FixedInactivePartsActionFilter
      inactive_keys: [left_arm, left_gripper]
    action_state_merger:
      _target_: g05.data_processor.transforms.action_state_merger.PaddingActionMerger
      merge: true
      max_action_shape_meta: ${oc.load:configs/data/parts_meta/10k_wbc.yaml,parts_meta}
      max_state_shape_meta: ${oc.load:configs/data/parts_meta/10k_wbc.yaml,parts_meta}
    num_obs_steps: 1
    use_stepwise_action_norm: true
    drop_high_level_prob: 1.0
    use_zh_instruction: false

embodiment_datasets:
  galaxea_r1pro:
    type: g05.data.battery_segment_dataset.BatterySegmentDataset
    embodiment_type: galaxea_r1pro
    lerobot_ds_version: '2.1'
    stats_downsample_rate: 1
    shape_meta: *shape_meta
    dataset_groups:
    - weight: 1.0
      dataset_dirs:
      - /mnt/cfs/7rnh3z/kele/0919/mt/cleaned_batteries
